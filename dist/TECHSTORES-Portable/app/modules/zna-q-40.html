<div id="zna-q-40" class="form-container">
                <div class="form-header"><h2 class="form-title">ZNA Q 40 — Artisan tools list</h2><button class="close-btn">&times;</button></div>
                <p class="q982-intro"><span class="aso-ref">Annex A</span> Artisan / technician tools list on personal or section charge.</p>
                <div class="qm-batch-form">
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Unit</label><input id="q40Unit" class="form-control" value="IT Dir Tech Stores"></div>
                        <div class="form-col"><label class="form-label">List No</label><input id="q40ListNo" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Trade</label><input id="q40Trade" class="form-control" placeholder="e.g. ICT technician"></div>
                        <div class="form-col"><label class="form-label">Date</label><input type="date" id="q40Date" class="form-control"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Holder</label><input id="q40Holder" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Force No</label><input id="q40ForceNo" class="form-control"></div>
                    </div>
                    <div class="form-table-wrapper"><table class="qm-batch-table"><thead>
                        <tr><th>Tool / item</th><th>Qty auth</th><th>Qty held</th><th>Condition</th><th>Remarks</th><th class="qm-screen-only">Action</th></tr>
                    </thead><tbody id="zna-q-40-table-body"></tbody></table></div>
                    <button type="button" class="btn btn-primary qm-screen-only" style="margin:10px 0" onclick="addZnaQ40Row()">Add Row</button>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">QM / Store Officer</label><input id="q40QmSig" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Tool holder</label><input id="q40HolderSig" class="form-control"></div>
                    </div>
                </div>
                <button class="btn btn-success btn-save-module" style="margin-top:15px">Save Form</button>
                <button class="btn btn-secondary btn-print-module" data-print-target="zna-q-40" style="margin-top:15px">Print Form</button>
                <button class="btn btn-secondary btn-generate-report" data-report-module="zna-q-40" style="margin-top:15px">Generate Report</button>
            </div>
