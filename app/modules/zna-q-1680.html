<div id="zna-q-1680" class="form-container">
                <div class="form-header"><h2 class="form-title">ZNA Q 1680 — Miscellaneous credit/debit voucher</h2><button class="close-btn">&times;</button></div>
                <p class="q982-intro"><span class="aso-ref">ASO · Annex A</span> Miscellaneous credit/debit voucher — recoveries to Public Funds (cash or from pay).</p>
                <div class="qm-batch-form">
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Voucher No</label><input id="q1680VoucherNo" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Date</label><input type="date" id="q1680Date" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Issuing unit</label><input id="q1680IssuingUnit" class="form-control" value="IT Dir Tech Stores"></div>
                        <div class="form-col"><label class="form-label">Issuing officer</label><input id="q1680IssuingOfficer" class="form-control"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Debtor name</label><input id="q1680DebtorName" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Force No</label><input id="q1680DebtorForce" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Debtor unit</label><input id="q1680DebtorUnit" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Recovery method</label>
                            <select id="q1680RecoveryMethod" class="form-control">
                                <option value="Cash">Cash</option>
                                <option value="From pay">From pay</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Circumstance</label>
                            <select id="q1680Circumstance" class="form-control">
                                <option value="Loss/damage — unit/establishment">Loss/damage — unit/establishment</option>
                                <option value="Loss/damage — individual (serving)">Loss/damage — individual (serving)</option>
                                <option value="Loss/damage — civilian / non-serving">Loss/damage — civilian / non-serving</option>
                                <option value="Barrack damage">Barrack damage</option>
                                <option value="Elect to pay for loss (cash)">Elect to pay for loss (cash)</option>
                                <option value="Authorised issue on repayment">Authorised issue on repayment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-col"><label class="form-label">Total amount</label><input id="q1680Amount" class="form-control" placeholder="USD / ZWG"></div>
                        <div class="form-col"><label class="form-label">Liability acknowledged</label>
                            <select id="q1680LiabilityAck" class="form-control">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-table-wrapper"><table class="qm-batch-table"><thead>
                        <tr>
                            <th>Particulars</th><th>Qty</th><th>Rate</th><th>Amount</th><th>Remarks</th><th class="qm-screen-only">Action</th>
                        </tr>
                    </thead><tbody id="zna-q-1680-table-body"></tbody></table></div>
                    <button type="button" class="btn btn-primary qm-screen-only" style="margin:10px 0" onclick="addZnaQ1680Row()">Add Row</button>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Debtor signature</label><input id="q1680DebtorSig" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Issuing officer signature</label><input id="q1680IssuerSig" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Imprest / Paymaster</label><input id="q1680ImprestHolder" class="form-control"></div>
                    </div>
                </div>
                <button class="btn btn-success btn-save-module" style="margin-top:15px">Save Form</button>
                <button class="btn btn-secondary btn-print-module" data-print-target="zna-q-1680" style="margin-top:15px">Print Form</button>
                <button class="btn btn-secondary btn-generate-report" data-report-module="zna-q-1680" style="margin-top:15px">Generate Report</button>
            </div>
