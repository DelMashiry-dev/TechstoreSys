<div id="zna-q-1" class="form-container">
                <div class="form-header"><h2 class="form-title">ZNA Q 1 — Statement of stores lost or damaged to be written off</h2><button class="close-btn">&times;</button></div>
                <p class="q982-intro"><span class="aso-ref">ASO · Annex A</span> Statement of stores lost or damaged to be written off (write-off schedule).</p>
                <div class="qm-batch-form">
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Unit</label><input id="q1Unit" class="form-control" value="IT Dir Tech Stores"></div>
                        <div class="form-col"><label class="form-label">Schedule No</label><input id="q1ScheduleNo" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Period</label><input id="q1Period" class="form-control" placeholder="e.g. FY 2026 Q2"></div>
                        <div class="form-col"><label class="form-label">Date</label><input type="date" id="q1Date" class="form-control"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Authority / powers of write-off</label><input id="q1Authority" class="form-control" placeholder="ASO Ch 6 Annex A / authority ref"></div>
                        <div class="form-col"><label class="form-label">Reason</label>
                            <select id="q1Reason" class="form-control">
                                <option value="Loss">Loss</option>
                                <option value="Damage">Damage</option>
                                <option value="Destruction">Destruction</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-table-wrapper"><table class="qm-batch-table"><thead>
                        <tr>
                            <th>Description</th><th>Qty</th><th>Book value</th><th>Authority / ref</th><th>Remarks</th><th class="qm-screen-only">Action</th>
                        </tr>
                    </thead><tbody id="zna-q-1-table-body"></tbody></table></div>
                    <button type="button" class="btn btn-primary qm-screen-only" style="margin:10px 0" onclick="addZnaQ1Row()">Add Row</button>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">QM / Store Officer</label><input id="q1QmSig" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Commanding Officer</label><input id="q1CoSig" class="form-control"></div>
                    </div>
                </div>
                <button class="btn btn-success btn-save-module" style="margin-top:15px">Save Form</button>
                <button class="btn btn-secondary btn-print-module" data-print-target="zna-q-1" style="margin-top:15px">Print Form</button>
                <button class="btn btn-secondary btn-generate-report" data-report-module="zna-q-1" style="margin-top:15px">Generate Report</button>
            </div>
