<div id="zna-q-998" class="form-container">
                <div class="form-header"><h2 class="form-title">ZNA Q 998 — Statement of Loss / Damage / Destruction</h2><button class="close-btn">&times;</button></div>
                <p class="q982-intro"><span class="aso-ref">ASO Pt 1 Ch 6</span> Statement when a Board of Inquiry is not required or as supporting document to write-off.</p>
                <div class="qm-batch-form">
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Unit</label><input id="q998Unit" class="form-control" value="IT Dir Tech Stores"></div>
                        <div class="form-col"><label class="form-label">Statement No</label><input id="q998StatementNo" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Date</label><input type="date" id="q998Date" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Location</label><input id="q998Location" class="form-control"></div>
                    </div>
                    <div class="form-group"><label class="form-label">Circumstances</label><textarea id="q998Circumstance" class="form-control" rows="4"></textarea></div>
                    <div class="form-table-wrapper"><table class="qm-batch-table"><thead>
                        <tr>
                            <th>Description</th><th>Serial / ZA</th><th>Qty</th><th>Condition</th><th>Est. value</th><th>Remarks</th><th class="qm-screen-only">Action</th>
                        </tr>
                    </thead><tbody id="zna-q-998-table-body"></tbody></table></div>
                    <button type="button" class="btn btn-primary qm-screen-only" style="margin:10px 0" onclick="addZnaQ998Row()">Add Row</button>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Board of Inquiry held?</label>
                            <select id="q998BoardHeld" class="form-control">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                                <option value="Pending">Pending</option>
                            </select>
                        </div>
                        <div class="form-col"><label class="form-label">Action taken / recommended</label><input id="q998ActionTaken" class="form-control" placeholder="e.g. Write-off on Q 1 / recovery on Q 1680"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-col"><label class="form-label">Reporting officer</label><input id="q998Reporter" class="form-control"></div>
                        <div class="form-col"><label class="form-label">Commanding Officer</label><input id="q998CoSig" class="form-control"></div>
                    </div>
                </div>
                <button class="btn btn-success btn-save-module" style="margin-top:15px">Save Form</button>
                <button class="btn btn-secondary btn-print-module" data-print-target="zna-q-998" style="margin-top:15px">Print Form</button>
                <button class="btn btn-secondary btn-generate-report" data-report-module="zna-q-998" style="margin-top:15px">Generate Report</button>
            </div>
